<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">観測の条件も、検証の対象にする</title>
<desc id="desc">評価する側のモデル・目的・介入を含めて考える</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     11</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">観測の条件も、検証の対象にする</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">評価する側のモデル・目的・介入を含めて考える</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<rect x="65" y="205" width="1070" height="345" rx="16" fill="none" stroke="#cad5d3" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600" y="242" fill="#182e3a" font-size="24" text-anchor="middle" font-weight="700">観測者を含む相互作用系</text>
<rect x="110" y="287" width="355" height="97" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="287.5" y="331.5" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">観測者・評価器</text>
<text x="287.5" y="365.5" fill="#566773" font-size="20" text-anchor="middle" font-weight="400">規則 θ とモデル</text>
<rect x="740" y="287" width="350" height="97" rx="14" fill="#ffffff" stroke="#3c60a4" stroke-width="2"/>
<text x="915.0" y="331.5" fill="#3c60a4" font-size="25" text-anchor="middle" font-weight="700">対象システム</text>
<text x="915.0" y="365.5" fill="#566773" font-size="20" text-anchor="middle" font-weight="400">状態 x と振る舞い</text>
<line x1="470.0" y1="320.0" x2="735.0" y2="320.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="303" fill="#182e3a" font-size="22" text-anchor="middle" font-weight="400">判断・介入</text>
<line x1="735.0" y1="360.0" x2="470.0" y2="360.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="398" fill="#182e3a" font-size="22" text-anchor="middle" font-weight="400">観測・証拠</text>
<rect x="390" y="446" width="420" height="72" rx="14" fill="#ffffff" stroke="#b95130" stroke-width="2"/>
<text x="600.0" y="490.0" fill="#b95130" font-size="25" text-anchor="middle" font-weight="700">観測規則の再検討</text>
<path d="M 285 384 L 285 480 L 385 480" fill="none" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 815 480 L 915 480 L 915 389" fill="none" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="601" fill="#182e3a" font-size="25" text-anchor="middle" font-weight="400">対象・基準・手順・版・根拠・未検証範囲を記録する。</text>
<text x="50" y="652" fill="#566773" font-size="19" text-anchor="start" font-weight="400">観測者の存在は、再現可能な比較の放棄を意味しない。どの条件で確かめたかを公開する。</text>
</g>
</svg>
