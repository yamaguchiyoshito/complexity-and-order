<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">同じ揺らぎでも、戻されるか増幅されるかが変わる</title>
<desc id="desc">超臨界ピッチフォーク分岐の正規形 u̇ = μu − u³ の定常解と安定性</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     03-2</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">同じ揺らぎでも、戻されるか増幅されるかが変わる</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">超臨界ピッチフォーク分岐の正規形 u̇ = μu − u³ の定常解と安定性</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<line x1="180.0" y1="395.0" x2="1020.0" y2="395.0" stroke="#182e3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="575.0" x2="600.0" y2="220.0" stroke="#182e3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1150" y="388" fill="#566773" font-size="20" text-anchor="end" font-weight="400">μ（駆動の強さ）</text>
<text x="614" y="214" fill="#566773" font-size="20" text-anchor="start" font-weight="400">u（パターンの振幅）</text>
<text x="592" y="422" fill="#566773" font-size="18" text-anchor="end" font-weight="400">μ = 0（分岐点）</text>
<line x1="200.0" y1="395.0" x2="600.0" y2="395.0" stroke="#087f83" stroke-width="4"/>
<line x1="600.0" y1="395.0" x2="1000.0" y2="395.0" stroke="#b95130" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M600.0,395.0 L610.0,373.3 L620.0,364.3 L630.0,357.3 L640.0,351.5 L650.0,346.4 L660.0,341.7 L670.0,337.5 L680.0,333.5 L690.0,329.8 L700.0,326.2 L710.0,322.9 L720.0,319.7 L730.0,316.6 L740.0,313.7 L750.0,310.8 L760.0,308.0 L770.0,305.4 L780.0,302.8 L790.0,300.2 L800.0,297.8 L810.0,295.4 L820.0,293.0 L830.0,290.7 L840.0,288.5 L850.0,286.3 L860.0,284.1 L870.0,282.0 L880.0,280.0 L890.0,277.9 L900.0,275.9 L910.0,274.0 L920.0,272.0 L930.0,270.1 L940.0,268.2 L950.0,266.4 L960.0,264.6 L970.0,262.8 L980.0,261.0 L990.0,259.2 L1000.0,257.5" fill="none" stroke="#087f83" stroke-width="4"/>
<path d="M600.0,395.0 L610.0,416.7 L620.0,425.7 L630.0,432.7 L640.0,438.5 L650.0,443.6 L660.0,448.3 L670.0,452.5 L680.0,456.5 L690.0,460.2 L700.0,463.8 L710.0,467.1 L720.0,470.3 L730.0,473.4 L740.0,476.3 L750.0,479.2 L760.0,482.0 L770.0,484.6 L780.0,487.2 L790.0,489.8 L800.0,492.2 L810.0,494.6 L820.0,497.0 L830.0,499.3 L840.0,501.5 L850.0,503.7 L860.0,505.9 L870.0,508.0 L880.0,510.0 L890.0,512.1 L900.0,514.1 L910.0,516.0 L920.0,518.0 L930.0,519.9 L940.0,521.8 L950.0,523.6 L960.0,525.4 L970.0,527.2 L980.0,529.0 L990.0,530.8 L1000.0,532.5" fill="none" stroke="#087f83" stroke-width="4"/>
<text x="240.0" y="425.0" fill="#087f83" font-size="19" text-anchor="middle" font-weight="400">u = 0（安定）</text>
<text x="720.0" y="425.0" fill="#b95130" font-size="19" text-anchor="middle" font-weight="400">u = 0（不安定）</text>
<text x="1010" y="264.5" fill="#087f83" font-size="19" text-anchor="start" font-weight="400">u = +√μ</text>
<text x="1010" y="539.5" fill="#087f83" font-size="19" text-anchor="start" font-weight="400">u = −√μ</text>
<line x1="360.0" y1="319.4" x2="360.0" y2="384.0" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="360.0" y1="470.6" x2="360.0" y2="406.0" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="360.0" y="279.0" fill="#3c60a4" font-size="20" text-anchor="middle" font-weight="700">ずれは戻される</text>
<line x1="840.0" y1="378.5" x2="840.0" y2="301.5" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="840.0" y1="411.5" x2="840.0" y2="488.5" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="840.0" y1="236.9" x2="840.0" y2="276.8" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="840.0" y1="553.1" x2="840.0" y2="513.2" stroke="#3c60a4" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="840.0" y="588.0" fill="#3c60a4" font-size="20" text-anchor="middle" font-weight="700">u = 0 からのずれは増幅され、±√μ で止まる</text>
<line x1="190.0" y1="206.0" x2="250.0" y2="206.0" stroke="#087f83" stroke-width="4"/>
<text x="262" y="212" fill="#566773" font-size="19" text-anchor="start" font-weight="400">実線 = 安定な定常解</text>
<line x1="190.0" y1="234.0" x2="250.0" y2="234.0" stroke="#b95130" stroke-width="3" stroke-dasharray="8 7"/>
<text x="262" y="240" fill="#566773" font-size="19" text-anchor="start" font-weight="400">破線 = 不安定な定常解</text>
<text x="50" y="612" fill="#566773" font-size="19" text-anchor="start" font-weight="400">正規形の説明図。対流の実験データではない。μ は駆動の強さを表す一般的な記号。</text>
</g>
</svg>
