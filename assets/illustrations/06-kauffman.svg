<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">成立を助ける関係と、変更を難しくする関係</title>
<desc id="desc">自己触媒集合とNKモデルの「関係」は、同じものではない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     06</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">成立を助ける関係と、変更を難しくする関係</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">自己触媒集合とNKモデルの「関係」は、同じものではない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<rect x="45" y="205" width="535" height="362" rx="16" fill="none" stroke="#cad5d3" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="620" y="205" width="535" height="362" rx="16" fill="none" stroke="#cad5d3" stroke-width="2" stroke-dasharray="7 7"/>
<text x="313" y="248" fill="#182e3a" font-size="25" text-anchor="middle" font-weight="700">相互触媒の概念模型</text>
<rect x="153" y="304" width="90" height="62" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="198.0" y="343.0" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">A</text>
<rect x="380" y="304" width="90" height="62" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="425.0" y="343.0" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">B</text>
<rect x="265" y="442" width="90" height="62" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="310.0" y="481.0" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">C</text>
<line x1="244.0" y1="335.0" x2="378.0" y2="335.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="404.0" y1="367.0" x2="340.0" y2="439.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="281.0" y1="439.0" x2="220.0" y2="368.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="313" y="545" fill="#566773" font-size="21" text-anchor="middle" font-weight="400">外部の基礎資源が必要</text>
<text x="888" y="248" fill="#182e3a" font-size="25" text-anchor="middle" font-weight="700">評価寄与の相互依存</text>
<rect x="682" y="302" width="100" height="66" rx="14" fill="#ffffff" stroke="#3c60a4" stroke-width="2"/>
<text x="732.0" y="343.0" fill="#3c60a4" font-size="25" text-anchor="middle" font-weight="700">x₁</text>
<rect x="986" y="302" width="100" height="66" rx="14" fill="#ffffff" stroke="#3c60a4" stroke-width="2"/>
<text x="1036.0" y="343.0" fill="#3c60a4" font-size="25" text-anchor="middle" font-weight="700">x₂</text>
<rect x="834" y="448" width="100" height="66" rx="14" fill="#ffffff" stroke="#3c60a4" stroke-width="2"/>
<text x="884.0" y="489.0" fill="#3c60a4" font-size="25" text-anchor="middle" font-weight="700">fᵢ</text>
<line x1="751.0" y1="370.0" x2="849.0" y2="445.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1017.0" y1="370.0" x2="919.0" y2="445.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="551" fill="#566773" font-size="21" text-anchor="middle" font-weight="400">組合せで評価が変わる</text>
<text x="50" y="652" fill="#566773" font-size="19" text-anchor="start" font-weight="400">左は反応の促進、右は適応度への依存。共通の最適結合数が直接導かれるわけではない。</text>
</g>
</svg>
