<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">戻りやすさと、移りにくさは別の量である</title>
<desc id="desc">平衡へ戻る速さ（安定性）と、別の領域へ移る前に吸収できる外乱の大きさ（レジリエンス）</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     19</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">戻りやすさと、移りにくさは別の量である</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">平衡へ戻る速さ（安定性）と、別の領域へ移る前に吸収できる外乱の大きさ（レジリエンス）</text>
