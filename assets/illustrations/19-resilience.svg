<text x="182.0" y="454" fill="#566773" font-size="14" text-anchor="middle" font-weight="400">外乱</text>
<line x1="640.0" y1="378.0" x2="804.0" y2="378.0" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="722.0" y="364" fill="#566773" font-size="14" text-anchor="middle" font-weight="400">外乱</text>
<path d="M252.0,460 Q390.0,420 420.0,262" fill="none" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="430.0" y="252" fill="#b95130" font-size="15" text-anchor="start" font-weight="400">小さな外乱でも別の領域へ出る</text>
<text x="240.0" y="560" fill="#087f83" font-size="19" text-anchor="middle" font-weight="700">戻りが速いが、器は狭い</text>
<text x="240.0" y="586" fill="#566773" font-size="15" text-anchor="middle" font-weight="400">安定性は高く、レジリエンスは低い</text>
<text x="830.0" y="560" fill="#b95130" font-size="19" text-anchor="middle" font-weight="700">戻りは遅いが、器は広い</text>
<text x="830.0" y="586" fill="#566773" font-size="15" text-anchor="middle" font-weight="400">安定性は低く、レジリエンスは高い</text>
<text x="50" y="612" fill="#566773" font-size="19" text-anchor="start" font-weight="400">概念図。ホリングの定義の説明であり、特定の系の測定ではない。器の形は系ごとに違う。</text>
