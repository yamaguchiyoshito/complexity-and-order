<text x="856.0" y="566" fill="#182e3a" font-size="16" text-anchor="start" font-weight="400">遅い・大きい：技術・信頼・記録の蓄積</text>
<text x="600" y="246" fill="#566773" font-size="15" text-anchor="middle" font-weight="400">各周期は、成長 → 保全 → 解放 → 再編成をたどる</text>
<line x1="430.0" y1="330.0" x2="430.0" y2="395.0" stroke="#b95130" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="418" y="370" fill="#b95130" font-size="15" text-anchor="end" font-weight="400">反乱：速い層の崩壊が遅い層へ波及</text>
<line x1="770.0" y1="520.0" x2="770.0" y2="455.0" stroke="#087f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="782" y="490" fill="#087f83" font-size="15" text-anchor="start" font-weight="400">記憶：遅い層の蓄積が速い層の再編成を支える</text>
<text x="50" y="672" fill="#566773" font-size="19" text-anchor="start" font-weight="400">概念図。適応サイクルは分析の枠組みであり、すべての系が同じ順序で回る法則ではない。</text>
