<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">先に選ばれた方が、次も選ばれやすくなる</title>
<desc id="desc">対等だった二つの道が、利用者と教材と接続先の蓄積で非対称になる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     17</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">先に選ばれた方が、次も選ばれやすくなる</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">対等だった二つの道が、利用者と教材と接続先の蓄積で非対称になる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<line x1="120.0" y1="560.0" x2="1100.0" y2="560.0" stroke="#182e3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1100" y="586" fill="#566773" font-size="17" text-anchor="end" font-weight="400">時間（採用者の到着）</text>
<line x1="120.0" y1="560.0" x2="120.0" y2="230.0" stroke="#182e3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="132" y="236" fill="#566773" font-size="17" text-anchor="start" font-weight="400">累積の採用と周辺の蓄積</text>
<path d="M120.0,560.0 L139.6,559.4 L159.2,558.6 L178.8,557.5 L198.4,556.2 L218.0,554.8 L237.6,553.0 L257.2,551.1 L276.8,549.0 L296.4,546.6 L316.0,544.0 L335.6,541.2 L355.2,538.2 L374.8,534.9 L394.4,531.4 L414.0,527.8 L433.6,523.8 L453.2,519.7 L472.8,515.4 L492.4,510.8 L512.0,506.0 L531.6,501.0 L551.2,495.8 L570.8,490.3 L590.4,484.6 L610.0,478.8 L629.6,472.6 L649.2,466.3 L668.8,459.8 L688.4,453.0 L708.0,446.0 L727.6,438.8 L747.2,431.4 L766.8,423.7 L786.4,415.8 L806.0,407.8 L825.6,399.4 L845.2,390.9 L864.8,382.2 L884.4,373.2 L904.0,364.0 L923.6,354.6 L943.2,345.0 L962.8,335.1 L982.4,325.0 L1002.0,314.8 L1021.6,304.2 L1041.2,293.5 L1060.8,282.6 L1080.4,271.4 L1100.0,260.0" fill="none" stroke="#087f83" stroke-width="5"/>
<path d="M120.0,560.0 L139.6,559.5 L159.2,559.0 L178.8,558.5 L198.4,558.0 L218.0,557.5 L237.6,557.0 L257.2,556.5 L276.8,556.0 L296.4,555.5 L316.0,555.0 L335.6,554.5 L355.2,554.0 L374.8,553.5 L394.4,553.0 L414.0,552.4 L433.6,551.8 L453.2,551.2 L472.8,550.6 L492.4,550.0 L512.0,549.4 L531.6,548.7 L551.2,548.0 L570.8,547.3 L590.4,546.6 L610.0,545.8 L629.6,545.0 L649.2,544.2 L668.8,543.4 L688.4,542.6 L708.0,541.8 L727.6,540.9 L747.2,540.0 L766.8,539.1 L786.4,538.2 L806.0,537.2 L825.6,536.2 L845.2,535.2 L864.8,534.2 L884.4,533.2 L904.0,532.2 L923.6,531.1 L943.2,530.0 L962.8,528.9 L982.4,527.8 L1002.0,526.6 L1021.6,525.4 L1041.2,524.2 L1060.8,523.0 L1080.4,521.8 L1100.0,520.6" fill="none" stroke="#b95130" stroke-width="5"/>
<text x="600" y="300" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">A：採用者・教材・接続先が積み上がる</text>
<text x="480" y="522" fill="#b95130" font-size="18" text-anchor="start" font-weight="700">B：利用が増えず、周辺が育たない</text>
<line x1="355.0" y1="560.0" x2="355.0" y2="250.0" stroke="#566773" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="355" y="586" fill="#566773" font-size="16" text-anchor="middle" font-weight="400">初期の偶然（到着順）</text>
<line x1="640.0" y1="560.0" x2="640.0" y2="250.0" stroke="#566773" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="640" y="586" fill="#566773" font-size="16" text-anchor="middle" font-weight="400">固定：Bを好む人もAを選ぶ</text>
<rect x="950" y="288" width="150" height="24" rx="12" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="1025" y="306" fill="#087f83" font-size="14" text-anchor="middle" font-weight="400">利用者</text>
<rect x="950" y="318" width="150" height="24" rx="12" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="1025" y="336" fill="#087f83" font-size="14" text-anchor="middle" font-weight="400">教材・知識</text>
<rect x="950" y="348" width="150" height="24" rx="12" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="1025" y="366" fill="#087f83" font-size="14" text-anchor="middle" font-weight="400">周辺システム</text>
<text x="1025" y="280" fill="#566773" font-size="15" text-anchor="middle" font-weight="400">Aに積み上がるもの</text>
<text x="50" y="612" fill="#566773" font-size="19" text-anchor="start" font-weight="400">概念図。アーサーの収穫逓増モデルの数値結果ではなく、採用の蓄積が次の採用を有利にする構図。</text>
</g>
</svg>
