<text x="460" y="258" fill="#566773" font-size="15" text-anchor="start" font-weight="400">受け渡しの単位で、次の状態がよく決まる</text>
<rect x="810" y="200" width="340" height="330" rx="16" fill="none" stroke="#cad5d3" stroke-width="2" stroke-dasharray="7 7"/>
