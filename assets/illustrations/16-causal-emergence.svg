<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">原因が見える粒度は、一つではない</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">同一システムを個別要素・集団・全体の三段階で表す。粗すぎても細かすぎても見えない</text>
