<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">生産する過程が、自分の成立条件をつくる</title>
<desc id="desc">構成要素・境界・生産過程の循環を、細胞の概念模型として描く</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     05</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">生産する過程が、自分の成立条件をつくる</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">構成要素・境界・生産過程の循環を、細胞の概念模型として描く</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<rect x="280" y="205" width="640" height="365" rx="16" fill="none" stroke="#cad5d3" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="385" y="245" width="430" height="86" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="600.0" y="296.0" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">生産・代謝の過程 P</text>
<rect x="360" y="435" width="480" height="92" rx="14" fill="#ffffff" stroke="#087f83" stroke-width="2"/>
<text x="600.0" y="489.0" fill="#087f83" font-size="25" text-anchor="middle" font-weight="700">構成要素 C と境界 B</text>
<path d="M 460 331 L 460 430" fill="none" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="415" y="388" fill="#182e3a" font-size="22" text-anchor="end" font-weight="400">生成</text>
<path d="M 740 435 L 740 336" fill="none" stroke="#566773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="775" y="388" fill="#182e3a" font-size="22" text-anchor="start" font-weight="400">実現・維持</text>
<text x="118" y="346" fill="#182e3a" font-size="24" text-anchor="middle" font-weight="400">外部資源</text>
<line x1="55.0" y1="383.0" x2="275.0" y2="383.0" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1050" y="346" fill="#182e3a" font-size="24" text-anchor="middle" font-weight="400">外部への排出</text>
<line x1="925.0" y1="383.0" x2="1145.0" y2="383.0" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="652" fill="#566773" font-size="19" text-anchor="start" font-weight="400">循環図だけではオートポイエーシスの証明にならない。実際の生産と境界の条件を問う。</text>
</g>
</svg>
