<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">動きが続くことで、パターンが保たれる</title>
<desc id="desc">加熱された流体の対流を、散逸構造の概念例として見る</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#566773" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f8f7f2"/>
<g font-family="system-ui, Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="50" y="52" fill="#087f83" font-size="18" text-anchor="start" font-weight="700">COMPLEXITY / ORDER     03</text>
<text x="50" y="103" fill="#182e3a" font-size="34" text-anchor="start" font-weight="700">動きが続くことで、パターンが保たれる</text>
<text x="50" y="141" fill="#566773" font-size="21" text-anchor="start" font-weight="400">加熱された流体の対流を、散逸構造の概念例として見る</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d5dedc" stroke-width="1"/>
<rect x="180" y="240" width="840" height="270" rx="12" fill="#edf3f2" stroke="#cad5d3" stroke-width="2"/>
<line x1="180.0" y1="240.0" x2="1020.0" y2="240.0" stroke="#3c60a4" stroke-width="12"/>
<line x1="180.0" y1="510.0" x2="1020.0" y2="510.0" stroke="#b95130" stroke-width="12"/>
<text x="600" y="211" fill="#3c60a4" font-size="24" text-anchor="middle" font-weight="400">低温側へ熱が流れる</text>
<text x="600" y="563" fill="#b95130" font-size="24" text-anchor="middle" font-weight="400">高温側から供給が続く</text>
<path d="M 270 452 C 200 418 200 308 285 294 C 405 274 445 408 368 451" fill="none" stroke="#087f83" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M 648 451 C 725 408 685 274 565 294 C 480 308 480 418 550 452" fill="none" stroke="#087f83" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M 830 452 C 760 418 760 308 845 294 C 965 274 1005 408 928 451" fill="none" stroke="#087f83" stroke-width="5" marker-end="url(#arrow)"/>
<line x1="320.0" y1="610.0" x2="320.0" y2="575.0" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="320.0" y1="232.0" x2="320.0" y2="219.0" stroke="#3c60a4" stroke-width="2"/>
<line x1="600.0" y1="610.0" x2="600.0" y2="575.0" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="232.0" x2="600.0" y2="219.0" stroke="#3c60a4" stroke-width="2"/>
<line x1="880.0" y1="610.0" x2="880.0" y2="575.0" stroke="#b95130" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="880.0" y1="232.0" x2="880.0" y2="219.0" stroke="#3c60a4" stroke-width="2"/>
<text x="50" y="652" fill="#566773" font-size="19" text-anchor="start" font-weight="400">外部駆動と不可逆過程のもとで維持される秩序。対流の存在は階層形成の証明ではない。</text>
</g>
</svg>
